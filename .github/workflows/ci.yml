name: dotvet CI & Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-audit:
    name: Unit Tests & Self Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Node.js Test Suite
        run: npm test

      - name: Run Python Test Suite
        run: python -m unittest discover -s tests/python -p "test_*.py"

      - name: Verify CLI Executables
        run: |
          node bin/dotvet.js --version
          python -m dotvet.cli --version

      - name: Run dotvet Self-Audit Gate
        run: node bin/dotvet.js check --ci --strict
